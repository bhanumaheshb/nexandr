<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXANDR Vision — NEXANDR</title>
  <meta name="description" content="Computer vision and visual intelligence platform — detection, edge deployment, fleet management and event pipelines.">
  <link rel="canonical" href="https://nexandr.com/product-nexandr-vision.html">
  <meta name="theme-color" content="#0B2E22">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="NEXANDR">
  <meta property="og:title" content="NEXANDR Vision — NEXANDR">
  <meta property="og:description" content="Computer vision and visual intelligence platform — detection, edge deployment, fleet management and event pipelines.">
  <meta property="og:url" content="https://nexandr.com/product-nexandr-vision.html">
  <meta property="og:image" content="https://nexandr.com/assets/img/og-image.svg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/css/nexandr.css">
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js" defer></script>
</head>
<body data-page="products" class="bg-cream font-sans antialiased">
  <a href="#main" class="skip-link">Skip to content</a>
  <div data-nx="navbar"></div>
  <main id="main">

    <section class="relative overflow-hidden pt-[112px] sm:pt-[136px]">
      <div class="grid-field mask-fade-b pointer-events-none absolute inset-0 opacity-70" aria-hidden="true"></div>
      <div class="pointer-events-none absolute -right-28 -top-16 h-[460px] w-[460px] rounded-full bg-emerald/[0.09] blur-[130px] animate-float-slow" aria-hidden="true"></div>
      <div class="relative mx-auto max-w-content px-5 pb-16 sm:px-8 sm:pb-20">
        <nav class="reveal flex items-center gap-2 text-[13px] text-ink/45" aria-label="Breadcrumb">
          <a href="products.html" class="transition-colors hover:text-ink">Products</a>
          <span aria-hidden="true">/</span>
          <span class="text-ink/70" data-crumb></span>
        </nav>
        <div data-hero class="mt-8"></div>
      </div>
    </section>

    <section class="rule bg-cream-light">
      <div class="mx-auto max-w-content px-5 py-20 sm:px-8 sm:py-24">
        <div class="grid gap-10 lg:grid-cols-12 lg:gap-16">
          <div class="lg:col-span-5">
            <p class="reveal eyebrow text-emerald">Overview</p>
            <h2 class="reveal display mt-4 text-[clamp(1.7rem,3.4vw,2.4rem)] text-ink" style="--d:60ms">What it is.</h2>
          </div>
          <div class="lg:col-span-7">
            <p class="reveal text-[16px] leading-relaxed text-ink/70" data-overview style="--d:100ms"></p>
          </div>
        </div>

        <div class="mt-16 grid gap-5 lg:grid-cols-2">
          <div class="reveal card p-8">
            <h3 class="eyebrow text-emerald">Problem</h3>
            <ul class="mt-6 space-y-4" data-problem></ul>
          </div>
          <div class="reveal card bg-forest p-8 text-cream" style="--d:80ms">
            <h3 class="eyebrow text-lime/80">Solution</h3>
            <ul class="mt-6 space-y-4" data-solution></ul>
          </div>
        </div>
      </div>
    </section>

    <section class="mx-auto max-w-content px-5 py-24 sm:px-8 sm:py-28">
      <div data-features-header></div>
      <div class="mt-12 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" data-features></div>
    </section>

    <section class="relative overflow-hidden bg-forest-deep">
      <div class="grid-field-dark pointer-events-none absolute inset-0 opacity-60" aria-hidden="true"></div>
      <div class="pointer-events-none absolute -left-32 top-1/4 h-[400px] w-[400px] rounded-full bg-emerald/20 blur-[130px]" aria-hidden="true"></div>
      <div class="relative mx-auto max-w-content px-5 py-24 sm:px-8 sm:py-28">
        <div data-arch-header></div>
        <ol class="mt-12 space-y-3" data-architecture></ol>
      </div>
    </section>

    <section class="mx-auto max-w-content px-5 py-24 sm:px-8 sm:py-28">
      <div class="grid gap-12 lg:grid-cols-12 lg:gap-16">
        <div class="lg:col-span-5">
          <p class="reveal eyebrow text-emerald">Use cases</p>
          <h2 class="reveal display mt-4 text-[clamp(1.9rem,4vw,2.8rem)] text-ink" style="--d:60ms">Where it earns<br>its place.</h2>
          <p class="reveal measure mt-6 text-[15px] leading-relaxed text-ink/60" style="--d:120ms">
            Deployments start narrow and expand. These are the patterns we see work first.
          </p>
        </div>
        <ul class="lg:col-span-7" data-usecases></ul>
      </div>
    </section>
    <div data-nx="cta" data-cta='{"eyebrow": "Next step", "title": "Put NEXANDR Vision to work.", "text": "We onboard deliberately, with a technical walkthrough against your real environment before anything is committed.", "primary": {"label": "Request a walkthrough", "href": "contact.html"}, "secondary": {"label": "See all products", "href": "products.html"}}'></div>
  </main>

  <div data-nx="footer"></div>

  <script src="assets/js/data/site.js"></script>
  <script src="assets/js/data/products.js"></script>
  <script src="assets/js/components.js"></script>
  <script>window.PRODUCT_SLUG = "nexandr-vision";</script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const p = window.NEXANDR_PRODUCTS.find(x => x.slug === window.PRODUCT_SLUG);
      if (!p) return;

      document.querySelector('[data-crumb]').textContent = p.name;

      document.querySelector('[data-hero]').innerHTML = `
        <div class="grid gap-10 lg:grid-cols-12 lg:gap-12">
          <div class="lg:col-span-7">
            <div class="reveal flex flex-wrap items-center gap-3">
              <span class="inline-flex h-12 w-12 items-center justify-center rounded-[10px] border border-line bg-cream-light text-emerald">
                ${NX.icon(p.icon, 'w-[22px] h-[22px]')}
              </span>
              <span class="chip">${NX.esc(p.category)}</span>
              <span class="chip">${NX.statusDot(p.status)}${NX.esc(p.status)}</span>
            </div>
            <h1 class="reveal display mt-7 text-[clamp(2.4rem,6.2vw,4.2rem)] text-ink" style="--d:70ms">${NX.esc(p.name)}</h1>
            <p class="reveal mt-4 text-[18px] leading-relaxed text-ink/70" style="--d:120ms">${NX.esc(p.short)}</p>
            <p class="reveal measure mt-5 text-[15px] leading-relaxed text-ink/60" style="--d:170ms">${NX.esc(p.summary)}</p>
            <div class="reveal mt-9 flex flex-col gap-3 sm:flex-row" style="--d:220ms">
              <a href="contact.html" class="btn btn-primary justify-center">Request a walkthrough
                <svg class="btn-ico h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
              <a href="products.html" class="btn btn-ghost justify-center">All products</a>
            </div>
          </div>
          <div class="lg:col-span-5">
            <div class="reveal card card-accent h-full p-8" style="--d:140ms">
              <p class="eyebrow text-ink/25">At a glance</p>
              <dl class="mt-6 space-y-5">
                <div class="border-b border-line pb-5">
                  <dt class="text-[13px] text-ink/45">Category</dt>
                  <dd class="display mt-1.5 text-[1.15rem] text-ink">${NX.esc(p.category)}</dd>
                </div>
                <div class="border-b border-line pb-5">
                  <dt class="text-[13px] text-ink/45">Status</dt>
                  <dd class="display mt-1.5 text-[1.15rem] text-ink">${NX.esc(p.status)}</dd>
                </div>
                <div>
                  <dt class="text-[13px] text-ink/45">Deployment</dt>
                  <dd class="display mt-1.5 text-[1.15rem] text-ink">Cloud · Private · Hybrid</dd>
                </div>
              </dl>
            </div>
          </div>
        </div>`;

      document.querySelector('[data-overview]').textContent = p.overview;

      const bullet = (cls) => (x) =>
        `<li class="flex gap-3 text-[14.5px] leading-relaxed ${cls.text}"><span class="mt-[8px] h-1 w-1 shrink-0 rounded-full ${cls.dot}"></span>${NX.esc(x)}</li>`;
      document.querySelector('[data-problem]').innerHTML =
        p.problem.map(bullet({ text: 'text-ink/65', dot: 'bg-emerald' })).join('');
      document.querySelector('[data-solution]').innerHTML =
        p.solution.map(bullet({ text: 'text-cream/70', dot: 'bg-lime' })).join('');

      document.querySelector('[data-features-header]').innerHTML = NX.sectionHeader({
        eyebrow: 'Key features',
        title: 'What the platform does.',
        text: 'Each capability is built to be used independently and to compose with the rest.',
      });
      document.querySelector('[data-features]').innerHTML = p.features.map((f, i) => `
        <article class="reveal card card-hover card-accent p-7" style="--d:${i * 60}ms">
          <span class="eyebrow text-ink/25">${String(i + 1).padStart(2, '0')}</span>
          <h3 class="display mt-5 text-[1.2rem] text-ink">${NX.esc(f.title)}</h3>
          <p class="mt-3 text-[14px] leading-relaxed text-ink/60">${NX.esc(f.text)}</p>
        </article>`).join('');

      document.querySelector('[data-arch-header]').innerHTML = NX.sectionHeader({
        eyebrow: 'Architecture',
        title: 'How it is put together.',
        text: 'Layered, portable and deployable into managed cloud, your own cloud or private infrastructure.',
        tone: 'dark',
      });
      document.querySelector('[data-architecture]').innerHTML = p.architecture.map((a, i) => `
        <li class="reveal card card-dark card-hover flex flex-col gap-2 p-6 sm:flex-row sm:items-center sm:gap-8" style="--d:${i * 70}ms">
          <span class="eyebrow w-10 shrink-0 text-lime/60">${String(i + 1).padStart(2, '0')}</span>
          <span class="display w-full text-[1.2rem] text-cream sm:w-44 sm:shrink-0">${NX.esc(a.layer)}</span>
          <span class="flex-1 text-[14px] leading-relaxed text-cream/55">${NX.esc(a.text)}</span>
        </li>`).join('');

      document.querySelector('[data-usecases]').innerHTML = p.useCases.map((u, i) => `
        <li class="reveal flex gap-6 border-t border-line py-6 first:border-t-0 first:pt-0" style="--d:${i * 70}ms">
          <span class="eyebrow shrink-0 pt-1 text-ink/25">${String(i + 1).padStart(2, '0')}</span>
          <p class="text-[15px] leading-relaxed text-ink/65">${NX.esc(u)}</p>
        </li>`).join('');
    });
  </script>

  <script src="assets/js/main.js"></script>
</body>
</html>
